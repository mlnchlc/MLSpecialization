[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ml-specialization"
version = "1.0.0"
description = "Quick-reference code companion for Andrew Ng's Machine Learning Specialization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ML Specialization Reference" },
]
keywords = ["machine-learning", "deep-learning", "education", "reference"]

dependencies = [
    "numpy>=1.24.0,<2",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.13.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
